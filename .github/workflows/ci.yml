name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]  # a release tag must equal the package version (MCF-27)

permissions:
  contents: read

jobs:
  test:
    name: Style and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the back-test review checks the git history (MCF-20)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,web]" -c constraints.txt
      - name: Style
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest

  package:
    name: Clean install of the wheel (Python ${{ matrix.python-version }}, MCF-27)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel
        run: pip wheel . --no-deps -w dist
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet "$(ls dist/mcf-*.whl)[web]" -c constraints.txt
          cd /tmp && /tmp/clean/bin/mcf --help
          /tmp/clean/bin/mcf forecast "$GITHUB_WORKSPACE/examples/sample_team.csv" --backlog 40
      - name: The tag equals the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(/tmp/clean/bin/python -c "import mcf; print(mcf.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }

  security:
    name: Secret, dependency and licence scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action reads the PR commit list
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # no write access needed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,web]" -c constraints.txt
      - name: Dependency scan (pip-audit)
        run: pip-audit --skip-editable
      - name: Licence scan of runtime dependencies (pip-licenses, D19)
        run: |
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install --quiet ".[web]" -c constraints.txt
          pip-licenses --python /tmp/runtime/bin/python \
            --fail-on="${STRONG_COPYLEFT}"
        env:
          # Exact licence names (no substring match), so LGPL is allowed.
          STRONG_COPYLEFT: "GPL-2.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0;GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;GNU General Public License (GPL);GNU General Public License v2 (GPLv2);GNU General Public License v2 or later (GPLv2+);GNU General Public License v3 (GPLv3);GNU General Public License v3 or later (GPLv3+);GNU Affero General Public License v3;GNU Affero General Public License v3 or later (AGPLv3+)"
