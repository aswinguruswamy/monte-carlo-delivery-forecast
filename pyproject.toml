[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcf"
description = "Monte Carlo delivery forecast: 50%, 85% and 95% dates from team throughput, with a back-test against velocity."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Aswin Guruswamy" }]
dynamic = ["version"]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.scripts]
mcf = "mcf.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "pip-licenses==5.5.5",
    "pyyaml>=6.0",
]
web = [
    "streamlit>=1.67.0",  # st.altair_chart(width=...) needs 1.51
]

[tool.hatch.version]
path = "src/mcf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
